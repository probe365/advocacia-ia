<h5 class="mb-3">{{ modal_title }}</h5>

<form 
  method="POST"
  {% if cliente %}
    hx-post="{{ url_for('clientes.ui_edit_cliente',
                        id_cliente=cliente.id_cliente) }}"
    hx-target="#lista-clientes"
    hx-swap="innerHTML"
  {% else %}
    hx-post="{{ url_for('clientes.ui_create_cliente') }}"
    hx-target="#lista-clientes"
    hx-swap="innerHTML"
  {% endif %}
>

  <div class="mb-3">
    <label for="tipo_pessoa" class="form-label">Tipo de Pessoa</label>
    <select class="form-select" name="tipo_pessoa" required>
      <option value="Física" {% if cliente and cliente.tipo_pessoa == 'Física' %}selected{% endif %}>
        Pessoa Física
      </option>
      <option value="Jurídica" {% if cliente and cliente.tipo_pessoa == 'Jurídica' %}selected{% endif %}>
        Pessoa Jurídica
      </option>
    </select>
  </div>

  <div class="mb-3">
    <label for="nome_completo" class="form-label">Nome Completo</label>
    <input type="text" class="form-control" name="nome_completo" value="{{ cliente.nome_completo if cliente else '' }}" required>
  </div>
  <div class="mb-3">
    <label for="cpf_cnpj" class="form-label">CPF / CNPJ</label>
    <input type="text" class="form-control" name="cpf_cnpj" value="{{ cliente.cpf_cnpj if cliente else '' }}" required>
  </div>
  <div class="mb-3">
    <label for="email" class="form-label">Email</label>
    <input type="email" class="form-control" name="email" value="{{ cliente.email if cliente else '' }}">
  </div>
  <div class="mb-3">
    <label for="telefone" class="form-label">Telefone</label>
    <input type="text" class="form-control" name="telefone" value="{{ cliente.telefone if cliente else '' }}">
  </div>
  <div class="mb-3">
    <label for="nacionalidade" class="form-label">Nacionalidade</label>
    <input type="text" class="form-control" name="nacionalidade" value="{{ cliente.nacionalidade if cliente else '' }}">
  </div>
  <div class="mb-3">
    <label for="estado_civil" class="form-label">Estado Civil</label>
    <input type="text" class="form-control" name="estado_civil" value="{{ cliente.estado_civil if cliente else '' }}">
  </div>
  <div class="mb-3">
    <label for="profissao" class="form-label">Profissão</label>
    <input type="text" class="form-control" name="profissao" value="{{ cliente.profissao if cliente else '' }}">
  </div>
  <div class="mb-3">
    <label for="endereco_completo" class="form-label">Endereço Completo</label>
    <input type="text" class="form-control" name="endereco_completo" value="{{ cliente.endereco_completo if cliente else '' }}">
  </div>
  <div class="mb-3">
    <label for="rg_ie" class="form-label">RG - IE</label>
    <input type="text" class="form-control" name="rg_ie" value="{{ cliente.rg_ie if cliente else '' }}">
  </div>
  <div class="mb-3">
    <label for="observacoes" class="form-label">Observações</label>
    <textarea class="form-control" name="observacoes">{{ cliente.observacoes if cliente else '' }}</textarea>
  </div>

  <hr>
  <div class="d-flex justify-content-end">
    <button type="button" class="btn btn-secondary me-2" data-bs-dismiss="modal">Cancelar</button>
    <button type="submit" class="btn btn-primary">
      {% if cliente %}Salvar Alterações{% else %}Salvar Cliente{% endif %}
    </button>
  </div>
</form>
