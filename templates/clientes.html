{% extends "base.html" %}

{% block title %}Lista de Clientes - Advocacia e IA{% endblock %}

{% block content %}
<div class="page-header">
  <div>
    <h1 class="page-title">Painel de Clientes</h1>
    <p class="page-subtitle">Controle clientes, casos e próximos passos com visão clara.</p>
  </div>
  <div class="page-actions">
    <button type="button" class="btn btn-primary btn-sm"
        data-bs-toggle="modal" data-bs-target="#clienteModal"
        hx-get="/clientes/ui/form" hx-target="#clienteModalBody">
        + Adicionar Novo Cliente
    </button>
  </div>
</div>

<div class="card app-card">
  <div class="card-body">
    <div class="row g-3" id="lista-clientes">
      {% include '_cards_cliente.html' %}
    </div>
  </div>
</div>


<div class="modal fade" id="clienteModal" tabindex="-1" aria-labelledby="clienteModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body" id="clienteModalBody">
        <div class="text-center">
          <div class="spinner-border" role="status">
            <span class="visually-hidden">Carregando...</span>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
