{% if not versions %}
  <div class="text-muted small">
    Nenhuma versão gerada ainda.
  </div>
{% else %}
  <h6 class="mb-2">📑 Versões</h6>

  <ul class="list-group list-group-sm">
    {% for v in versions %}
      <li class="list-group-item">
        <div class="d-flex justify-content-between">
          <strong>Versão {{ v.version }}</strong>
          <small class="text-muted">
            {{ v.created_at.strftime('%d/%m/%Y %H:%M') }}
          </small>
        </div>

        <details class="mt-2">
          <summary class="text-info" style="cursor:pointer">
            Visualizar conteúdo
          </summary>
          <pre class="mt-2 p-2 doc-preview rounded"
            style="font-size: 0.85rem;">
{{ v.rendered_content }}
          </pre>
        </details>
      </li>
    {% endfor %}
  </ul>
{% endif %}
