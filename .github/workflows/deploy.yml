name: Deploy to Droplet

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: deploy-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  deploy:
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ secrets.DEPLOY_URL }}
    env:
      SERVER_USER: ${{ secrets.SERVER_USER }}
      SERVER_IP: ${{ secrets.SERVER_IP }}
      DEPLOY_DIR: ${{ secrets.DEPLOY_DIR }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      SERVICE_NAME: ${{ secrets.SERVICE_NAME }}
    steps:
      - name: Validate secrets
        run: |
          missing=0
          for var in SERVER_USER SERVER_IP DEPLOY_DIR SSH_PRIVATE_KEY; do
            if [ -z "${!var}" ]; then
              echo "::error::Missing required secret $var"
              missing=1
            fi
          done
          if [ $missing -eq 1 ]; then
            exit 1
          fi

      - name: Check out commit that passed CI
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.workflow_run.head_repository.full_name }}
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s' "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "$SERVER_IP" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Ensure target directory exists
        run: |
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=yes "$SERVER_USER@$SERVER_IP" "mkdir -p '$DEPLOY_DIR'"

      - name: Rsync repository to Droplet
        run: |
          rsync -az --delete \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '.venv' \
            --exclude 'venv' \
            --exclude 'node_modules' \
            --exclude '__pycache__' \
            --exclude '*.pyc' \
            -e "ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=yes" \
            ./ "$SERVER_USER@$SERVER_IP:$DEPLOY_DIR/"

      - name: Run remote deploy commands
        run: |
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=yes "$SERVER_USER@$SERVER_IP" "DEPLOY_DIR='$DEPLOY_DIR' SERVICE_NAME='$SERVICE_NAME' bash -s" <<'EOF'
set -euo pipefail
cd "$DEPLOY_DIR"

if [ -x ./scripts/deploy.sh ]; then
  echo "Running scripts/deploy.sh"
  ./scripts/deploy.sh
elif [ -x ./deploy.sh ]; then
  echo "Running ./deploy.sh"
  ./deploy.sh
elif [ -f docker-compose.yml ] || [ -f docker-compose.yaml ]; then
  echo "docker-compose file detected; rebuilding"
  docker compose pull || true
  docker compose up -d --build
elif [ -f requirements.txt ]; then
  echo "Python app detected; installing requirements"
  if command -v python3 >/dev/null 2>&1; then
    python3 -m venv .venv || true
    . .venv/bin/activate
    pip install --upgrade pip
    pip install -r requirements.txt
  else
    echo "python3 not available on Droplet"
  fi
  if [ -n "$SERVICE_NAME" ]; then
    echo "Restarting service $SERVICE_NAME"
    sudo systemctl restart "$SERVICE_NAME" || sudo systemctl restart "$SERVICE_NAME.service" || true
  else
    echo "SERVICE_NAME not set; skipping systemd restart"
  fi
else
  echo "No deployment hook found (deploy.sh / docker compose / requirements)."
fi
EOF
